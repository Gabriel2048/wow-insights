name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, deliberately. Its name is the "ci" context the branch ruleset
  # requires, and GitHub bills per job rounded up to the minute — a matrix of
  # six one-line jobs bills six minutes for two minutes of work.
  #
  # There is no `paths-ignore` here on purpose: once `ci` is a required check,
  # a workflow that skips reports no status at all, and the pull request becomes
  # permanently unmergeable.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth for the version. setup-go v6+ hashes go.mod
          # for its cache key; v5 hashed go.sum and would fail outright on this
          # repo, which has none.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go fix (modernizers)
        run: |
          pending=$(go fix -diff ./...)
          if [ -n "$pending" ]; then
            echo "pending modernizations — run 'go fix ./...':"; echo "$pending"; exit 1
          fi

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned, not `latest`: this is a required check, and a new upstream
          # release must not be able to turn it red with no change to this repo.
          #
          # This version also has a floor. golangci-lint refuses to analyse a
          # module whose target Go version is newer than the Go the linter
          # binary was built with, so it must keep pace with go.mod's toolchain
          # line. v2.6.2 is built with go1.25 and fails against go1.26.8 with
          # "the Go language version used to build golangci-lint is lower than
          # the targeted Go version"; v2.13.2 is built with go1.27. Note this
          # cannot be caught by `go run`-ing the linter locally, which compiles
          # it with the local toolchain and so always satisfies the check.
          version: v2.13.2
          # Validate .golangci.yml against the schema rather than silently
          # ignoring a key that has been renamed.
          verify: true

      - name: test
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=cover.out ./...

      - name: coverage
        run: go tool cover -func=cover.out | tail -1

      - name: govulncheck
        # Pinned for the same reason as the linter. Run directly rather than via
        # the action: the toolchain is already installed above, and `go run
        # pkg@version` resolves outside this module, so it cannot touch go.mod.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/wowinsight .

      - name: no third-party dependencies
        # Zero dependencies is a deliberate project property (see AGENTS.md,
        # issue #9). Prose cannot enforce it; this can.
        run: |
          mods=$(go list -m all)
          if [ "$mods" != "wowinsight" ]; then
            echo "expected exactly one module, got:"; echo "$mods"; exit 1
          fi
